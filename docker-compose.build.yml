services:
  backend:
    image: pokecollector-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile

  frontend:
    image: pokecollector-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_HOLO_EFFECTS_API_BASE_URL: ${VITE_HOLO_EFFECTS_API_BASE_URL-https://pokecollector.romerg.de}
