name: Frontend Card System

on:
  pull_request:
    paths:
      - frontend/**
      - docs/CARD_SYSTEM.md
      - docs/FRONTEND.md
      - CONTRIBUTING.md
      - .github/workflows/frontend-card-system.yml
  push:
    branches:
      - main
    paths:
      - frontend/**
      - docs/CARD_SYSTEM.md
      - docs/FRONTEND.md
      - CONTRIBUTING.md
      - .github/workflows/frontend-card-system.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  card-system:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run architecture and unit tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Install visual-test browser
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile visual regression tests
        run: npm run test:visual
