name: Version Consistency

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-check:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate and current target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          [[ "$CHECK_SHA" =~ ^[0-9a-f]{40}$ ]]
          git check-ref-format "refs/heads/$BASE_BRANCH"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --tags origin "$CHECK_SHA" "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/policy-base"
          if [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ && "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags origin "$BEFORE_SHA"
          fi
          git checkout --detach "$CHECK_SHA"

      - name: Check version increase, consistency and release-tag reuse
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          args=(--check-tags)
          if [[ "$EVENT_NAME" == push && "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            args+=(--allow-tag-at-head)
            if [[ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
              args+=(--base "$BEFORE_SHA")
            fi
          elif [[ "$EVENT_NAME" == workflow_dispatch && "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            args+=(--allow-tag-at-head --base HEAD^)
          else
            args+=(--base refs/remotes/origin/policy-base)
          fi
          node --version
          node scripts/check-version.mjs "${args[@]}"

      - name: Test version policy and scoped Weblate automation
        run: node --test scripts/version.test.mjs scripts/weblate-version.test.mjs scripts/version-workflows.test.mjs

      - name: Check compose port mappings
        run: node scripts/check-compose-ports.mjs

      - name: Check compose port mapping safety
        run: node --test scripts/check-compose-ports.test.mjs
