# Only public card artwork and set logos/symbols may use the shared image cache.
# Product tokens, fingerprints and future image endpoints must stay uncached.
map $uri $image_cache_bypass {
    default 1;
    ~^/api/images/card/[^/]+/(small|large)$ 0;
    ~^/api/images/set/[^/]+/(logo|symbol)$ 0;
}

map $upstream_status $image_cache_response_bypass {
    default 1;
    200 0;
    304 0;
}

# Bounded disk cache for repeated public image requests.
proxy_cache_path /var/cache/nginx/images
    levels=1:2
    keys_zone=image_cache:20m
    max_size=1g
    inactive=1d
    use_temp_path=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 500M;
    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version
    server_tokens off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://assets.tcgdex.net https://raw.githubusercontent.com https://avatars.githubusercontent.com https://github.com data: blob:; connect-src 'self' https://pokecollector.romerg.de https://api.tcgdex.net https://api.frankfurter.app https://api.github.com https://raw.githubusercontent.com https://generativelanguage.googleapis.com" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Batch scans can contain up to 200 MiB of image data. Allow a small amount
    # of multipart overhead for that one upload endpoint without raising the
    # limit for every API route.
    location = /api/cards/recognize/jobs {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        client_max_body_size 205M;
    }

    # A scanner configuration test can run two three-attempt capability probes.
    # 1100s covers 6 * the largest 180s response budget plus retry overhead.
    location = /api/settings/scanner/test {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1100s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1100s;
        client_max_body_size 100M;
    }

    # The synchronous recognition endpoint remains available to API clients
    # and the legacy single-card UI. 1000s covers 5 * the largest 180s response
    # budget plus its bounded TCGdex work and retry overhead.
    location = /api/cards/recognize {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1000s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1000s;
        client_max_body_size 100M;
    }

    # Cache card and set images from backend to avoid redundant multi-hop I/O
    location ^~ /api/images/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;

        proxy_cache image_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        # Browser copies revalidate; public backend responses allow a short
        # shared-cache lifetime. Mutable artwork is never treated as immutable.
        proxy_cache_valid 200 60s;
        proxy_cache_revalidate on;
        proxy_cache_use_stale off;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_bypass $image_cache_bypass $http_authorization $http_cookie $arg_retry $http_cache_control $http_pragma;
        proxy_no_cache $image_cache_bypass $image_cache_response_bypass $http_authorization $http_cookie $arg_retry $http_cache_control $http_pragma;

        # Inherit all server security headers, including Content-Security-Policy.
        # Do not add location-level headers that suppress that inheritance.
    }

    # Proxy API requests to backend
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        client_max_body_size 100M;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
