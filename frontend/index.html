<!DOCTYPE html>
<html lang="en" data-color-mode="dark" data-accent="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pokemon TCG Collection</title>
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/pokeball.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#e3000b" />
    <script>
      (() => { try {
        const modes = ['system', 'light', 'dark'];
        const accents = ['default', 'fire', 'water', 'grass', 'electric', 'psychic', 'dragon', 'dark', 'fairy'];
        const storedMode = localStorage.getItem('pokecollector-color-mode');
        const mode = modes.includes(storedMode) ? storedMode : 'system';
        let accent = localStorage.getItem('pokecollector-accent');
        if (!accents.includes(accent)) {
          const legacy = localStorage.getItem('theme');
          accent = accents.includes(legacy) ? legacy : 'default';
          localStorage.setItem('pokecollector-accent', accent);
        }
        const resolved = mode === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : mode;
        const root = document.documentElement;
        root.dataset.colorMode = resolved;
        root.dataset.accent = accent;
        root.dataset.theme = accent;
        root.classList.toggle('dark', resolved === 'dark');
        root.style.colorScheme = resolved;
      } catch (_) {
        const root = document.documentElement;
        const resolved = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        root.dataset.colorMode = resolved;
        root.dataset.accent = 'default';
        root.classList.toggle('dark', resolved === 'dark');
        root.style.colorScheme = resolved;
      } })();
    </script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-bg text-text-primary font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
